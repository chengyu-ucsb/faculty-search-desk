name: Collect job postings

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/sources.json', 'scripts/collect.py', 'scripts/detail_extract.py', '.github/workflows/collect.yml']

permissions:
  contents: write

concurrency:
  group: desk-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Collect postings
        run: python scripts/collect.py
      - name: Save the feed
        run: |
          git config user.name "faculty-search-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set -euo pipefail
          cp data/feed.json /tmp/faculty-search-feed.json
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/faculty-search-feed.json data/feed.json
            git add data/feed.json
            if git diff --cached --quiet; then
              echo "Feed already up to date."
              exit 0
            fi
            git commit -m "Update job feed"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced; retrying feed write ($attempt/3)"
          done
          exit 1
