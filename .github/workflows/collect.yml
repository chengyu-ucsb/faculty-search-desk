name: Collect job postings

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/sources.json', 'scripts/collect.py']

permissions:
  contents: write

concurrency:
  group: desk-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Collect postings
        run: python scripts/collect.py
      - name: Save the feed
        run: |
          git config user.name "faculty-search-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update job feed"
            git pull --rebase origin main
            git push
          fi
