name: Check a link

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to check'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desk-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHECK_URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Check the link
        run: python scripts/collect.py --check "$CHECK_URL"
      - name: Save the verdict
        run: |
          git config user.name "faculty-search-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link-checks.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Record link check"
            git pull --rebase origin main
            git push
          fi
