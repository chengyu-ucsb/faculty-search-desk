<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faculty Search Desk</title>
<meta name="description" content="A personal academic job-application tracker that lives in a GitHub repository.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230E6B73'/%3E%3Cpath d='M8 9h16M8 15h16M8 21h10' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F1F3F4; --surface:#FFFFFF; --surface-2:#F7F9F9; --ink:#18242A; --muted:#5A6A71; --faint:#8A989E;
  --line:#D6DDE0; --line-strong:#B9C4C8;
  --accent:#0E6B73; --accent-ink:#0A5258; --accent-soft:#DDEEF0; --accent-text:#0B5B62;
  --good:#2A7A4B; --good-soft:#DFF0E5; --warn:#A86A12; --warn-soft:#F7EBD6; --crit:#B23A3A; --crit-soft:#F6E0E0;
  --shadow:0 1px 2px rgba(24,36,42,.06), 0 8px 24px rgba(24,36,42,.08);
  --radius:10px; --radius-sm:6px;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1517; --surface:#162024; --surface-2:#1B272C; --ink:#E4EAEC; --muted:#96A5AB; --faint:#6E7F86;
    --line:#26343A; --line-strong:#3A4B52;
    --accent:#56B8C0; --accent-ink:#8ED2D8; --accent-soft:#143236; --accent-text:#7FCBD2;
    --good:#5FC084; --good-soft:#163A26; --warn:#E0A94A; --warn-soft:#3D2C0F; --crit:#E07070; --crit-soft:#43201F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1517; --surface:#162024; --surface-2:#1B272C; --ink:#E4EAEC; --muted:#96A5AB; --faint:#6E7F86;
  --line:#26343A; --line-strong:#3A4B52;
  --accent:#56B8C0; --accent-ink:#8ED2D8; --accent-soft:#143236; --accent-text:#7FCBD2;
  --good:#5FC084; --good-soft:#163A26; --warn:#E0A94A; --warn-soft:#3D2C0F; --crit:#E07070; --crit-soft:#43201F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.display{font-family:var(--display)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9em}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header / nav ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand .repo{font-family:var(--mono);font-size:12px;color:var(--faint)}
.search{flex:1 1 260px;display:flex;align-items:center;position:relative;min-width:200px}
.search input[type=text]{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.search svg{position:absolute;left:12px;width:16px;height:16px;color:var(--faint);pointer-events:none}
.savestate{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.savestate.saving .dot{background:var(--warn);animation:pulse 1s infinite}
.savestate.saved .dot{background:var(--good)}
.savestate.error .dot{background:var(--crit)}
.savestate.readonly .dot{background:var(--faint)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.savestate.saving .dot{animation:none}}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.active{color:var(--accent-text);border-bottom-color:var(--accent)}
nav.tabs .count{font-family:var(--mono);font-size:11px;background:var(--accent-soft);color:var(--accent-text);padding:1px 6px;border-radius:999px}

main{max-width:1180px;margin:0 auto;padding:20px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:var(--radius-sm);margin-bottom:16px}
.banner.warn{border-left-color:var(--warn)}
.banner.crit{border-left-color:var(--crit)}
.banner p{flex:1}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
input[type=text],input[type=url],input[type=date],input[type=datetime-local],input[type=email],input[type=password],input[type=number],select,textarea{
  width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-2);color:var(--muted);border-style:dashed;cursor:not-allowed}
textarea{min-height:88px;resize:vertical;line-height:1.4}
label.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.field > span{text-transform:uppercase;letter-spacing:.04em;font-size:11px}
.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}
@media (max-width:720px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}.span2{grid-column:auto}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;color:var(--muted)}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.accent{background:var(--accent-soft);color:var(--accent-text);border-color:transparent}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.meter{height:6px;background:var(--line);border-radius:999px;overflow:hidden;min-width:60px}
.meter > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.meter.done > i{background:var(--good)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer}
.stat:hover{border-color:var(--line-strong)}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.1}
.stat .l{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.stat.hot .n{color:var(--crit)}

/* ---------- jobs list ---------- */
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.toolbar select{width:auto}
.joblist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.jobrow{display:grid;grid-template-columns:minmax(0,1.6fr) 130px 150px 140px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;color:inherit}
.jobrow:last-child{border-bottom:0}
.jobrow:hover{background:var(--surface-2)}
.jobrow.selected{background:var(--accent-soft)}
.jobrow .inst{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.2}
.jobrow .ttl{color:var(--ink);margin-top:1px}
.jobrow .sub{color:var(--muted);font-size:13px;margin-top:2px}
.jobrow .dl{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.jobrow .dl .days{display:block;font-size:11px;color:var(--muted)}
.jobrow .dl.soon .days{color:var(--warn);font-weight:500}
.jobrow .dl.past .days{color:var(--faint)}
.jobrow .dl.urgent .days{color:var(--crit);font-weight:500}
.jobrow .ready{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
@media (max-width:820px){
  .jobrow{grid-template-columns:1fr;gap:6px}
  .jobrow .ready{flex-direction:row;align-items:center}
  .jobrow .dl .days{display:inline;margin-left:8px}
}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--display);font-size:20px;color:var(--ink);margin-bottom:6px}
.empty p{max-width:52ch;margin:0 auto 12px}

/* ---------- detail ---------- */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:16px}
.detail-head{padding:18px 20px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.detail-head h2{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.15}
.detail-head .ttl{font-size:16px;color:var(--muted);margin-top:2px}
.subtabs{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.subtabs button.active{color:var(--accent-text);border-bottom-color:var(--accent)}
.detail-body{padding:18px 20px 22px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:6px 0 8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (max-width:600px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}

/* materials checklist */
.mat{display:grid;grid-template-columns:minmax(0,1.4fr) 150px minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mat:last-child{border-bottom:0}
.mat .name{font-weight:500}
.mat .name input{font-weight:500}
.mat .att{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
@media (max-width:820px){.mat{grid-template-columns:1fr 1fr}.mat .att{grid-column:span 2}}
.status-needed{color:var(--muted)} .status-draft{color:var(--warn)} .status-revising{color:var(--warn)} .status-ready{color:var(--good)} .status-submitted{color:var(--good)} .status-not_required{color:var(--faint)} .status-finalists_only{color:var(--faint)}
select.st{padding:5px 8px;font-size:13px;font-weight:600}
select.st.status-ready,select.st.status-submitted{border-color:var(--good)}
select.st.status-draft,select.st.status-revising{border-color:var(--warn)}

/* interviews */
.round{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface-2)}
.round + .round{margin-top:10px}
.tasks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.tasks li{display:flex;align-items:center;gap:8px}
.tasks li.done span{text-decoration:line-through;color:var(--faint)}
.tasks input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}

/* ---------- documents ---------- */
.dropzone{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);background:var(--surface);transition:border-color .15s,background .15s}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone input{display:none}
.doclist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.doc .name{font-weight:600;word-break:break-word}
.doc .meta{font-size:12px;color:var(--muted);font-family:var(--mono)}
.versions{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:3px}
.versions li{display:flex;justify-content:space-between;gap:8px;align-items:center}
.uploads{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.uploads .u{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);background:var(--surface-2)}
.uploads .u.ok{color:var(--good)} .uploads .u.err{color:var(--crit)}

/* ---------- discover ---------- */
.feeditem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.feeditem:last-child{border-bottom:0}
.feeditem .t{font-weight:600}
.feeditem .s{font-size:13px;color:var(--muted);margin-top:2px}
.feeditem.added{opacity:.6}
.terms{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.term{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text)}
.term.neg{background:var(--crit-soft);color:var(--crit);text-decoration:line-through}
.source{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.source:last-child{border-bottom:0}
.source .n{font-weight:600}
.source .u{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.source .st{font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.card h3{font-family:var(--display);font-size:20px;margin-bottom:8px}
.verdict{margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface-2)}
.verdict.ok{border-color:var(--good);background:var(--good-soft)}
.verdict.bad{border-color:var(--crit);background:var(--crit-soft)}
.verdict.meh{border-color:var(--warn);background:var(--warn-soft)}
.verdict ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}

/* ---------- settings ---------- */
.settings{max-width:720px}
ol.steps{padding-left:20px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}

/* ---------- toasts / dialogs ---------- */
.toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(92vw,520px)}
.toast{background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:var(--radius-sm);box-shadow:var(--shadow);font-size:14px;display:flex;gap:12px;align-items:center}
.toast.err{background:var(--crit);color:#fff}
.toast button{background:none;border:1px solid rgba(255,255,255,.4);color:inherit;border-radius:4px;padding:2px 8px;cursor:pointer}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.confirm .box{background:var(--surface);border-radius:var(--radius);padding:20px;max-width:420px;box-shadow:var(--shadow)}
.confirm h3{margin-bottom:8px}
.searchresults{display:flex;flex-direction:column;gap:6px}
.sr{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.sr:hover{border-color:var(--accent)}
.sr .k{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);min-width:70px}
.contact{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:center}
@media (max-width:720px){.contact{grid-template-columns:1fr}}
.callbox{border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;background:var(--surface-2)}
.example-tag{font-family:var(--mono);font-size:11px;color:var(--warn);border:1px dashed var(--warn);padding:1px 6px;border-radius:4px;margin-left:8px;vertical-align:middle}
footer{max-width:1180px;margin:30px auto 20px;padding:0 20px;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <h1>Faculty Search Desk</h1>
      <span class="repo" id="repoLabel"></span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchBox" type="text" placeholder="Search jobs, documents, postings…" autocomplete="off" aria-label="Search">
    </div>
    <div class="savestate readonly" id="saveState"><span class="dot"></span><span id="saveText">Loading…</span></div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-view="jobs" class="active">Jobs <span class="count" id="cntJobs">0</span></button>
    <button data-view="materials">Materials <span class="count" id="cntDocs">0</span></button>
    <button data-view="discover">Discover <span class="count" id="cntFeed">0</span></button>
    <button data-view="settings">Settings</button>
  </nav>
</header>

<main id="main"></main>
<footer>Your data lives in <span id="footRepo" class="mono">this repository</span> — every change you make here is a commit. Nothing is stored anywhere else.</footer>

<div class="toasts" id="toasts"></div>
<div id="confirmHost"></div>
<script>
/* =====================================================================
   Faculty Search Desk — single-file app.
   Data lives in the GitHub repository that serves this page:
     data/tracker.json      your jobs, materials, interviews, documents
     data/sources.json      job boards the daily collector watches
     data/feed.json         postings the collector found (written by Actions)
     data/link-checks.json  results of "check this link" (written by Actions)
     files/<doc>/v<N>/...   uploaded documents
   With a GitHub token saved in this browser, edits are committed through
   the GitHub API. Without one, the page is read-only.
   ===================================================================== */

/* ---------- constants ---------- */
const STAGES = [

/* ---------- utils ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const nowIso = () => new Date().toISOString();
const label = (list, key) => (list.find(([k]) => k === key) || [key, key])[1];
const opts = (list, sel) => list.map(([k,v]) => `<option value="${esc(k)}"${k===sel?' selected':''}>${esc(v)}</option>`).join('');
function fmtDate(s){ if(!s) return ''; const d = new Date(s.length===10 ? s+'T12:00:00' : s); if(isNaN(d)) return s; return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function fmtDateTime(s){ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return s; return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function fmtAgo(s){ if(!s) return 'never'; const ms=Date.now()-new Date(s).getTime(); const m=Math.round(ms/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<48) return h+' h ago'; return Math.round(h/24)+' days ago'; }
function daysUntil(s){ if(!s) return null; const d=new Date(s.slice(0,10)+'T12:00:00'); const t=new Date(); t.setHours(12,0,0,0); return Math.round((d-t)/86400000); }
function fmtBytes(n){ if(!n&&n!==0) return ''; if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(0)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
function safeName(name){ return name.replace(/[^\w.\-() ]+/g,'_').replace(/\s+/g,' ').trim().slice(0,120) || 'file'; }
function b64encodeUtf8(str){ return btoa(String.fromCharCode(...new TextEncoder().encode(str))); }
function b64decodeUtf8(b64){ const bin = atob(b64.replace(/\n/g,'')); const bytes = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function arrayBufferToB64(buf){ let s=''; const bytes=new Uint8Array(buf); const chunk=0x8000; for(let i=0;i<bytes.length;i+=chunk) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); return btoa(s); }
function guessCategory(fileName){
  const n = fileName.toLowerCase();
  if(/\bcv\b|curriculum|vitae|resume/.test(n)) return 'cv';
  if(/cover/.test(n)) return 'cover_letter';
  if(/research/.test(n)) return 'research_statement';
  if(/teaching.*(eval|evaluation)|evaluation/.test(n)) return 'teaching_evals';
  if(/teaching/.test(n)) return 'teaching_statement';
  if(/syllab/.test(n)) return 'syllabus';
  if(/writing|sample|paper|manuscript/.test(n)) return 'writing_sample';
  if(/dei|diversity|inclusion/.test(n)) return 'dei_statement';
  if(/service/.test(n)) return 'service_statement';
  if(/transcript/.test(n)) return 'transcripts';
  if(/reference|letter|recommend/.test(n)) return 'reference_letters';
  if(/job|posting|call|ad\b|position/.test(n)) return 'job_call';
  return 'other';
}

/* ---------- settings (this browser only) ---------- */
const settings = {
  get(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } },
  set(k,v){ try { v ? localStorage.setItem(k,v) : localStorage.removeItem(k); } catch(e){} }
};
function detectRepo(){
  const h = location.hostname, p = location.pathname.split('/').filter(Boolean);
  if(h.endsWith('.github.io')) return { owner: h.split('.')[0], repo: p[0] || (h.split('.')[0] + '.github.io') };
  return { owner: settings.get(LS.owner), repo: settings.get(LS.repo) };
}
function repoConf(){
  const d = detectRepo();
  return { owner: settings.get(LS.owner) || d.owner, repo: settings.get(LS.repo) || d.repo, branch: settings.get(LS.branch) || 'main', token: settings.get(LS.token) };
}

/* ---------- GitHub client ---------- */
class GHError extends Error { constructor(msg, status, body){ super(msg); this.status=status; this.body=body; } }
const gh = {
  base: 'https://api.github.com',
  headers(extra={}){
    const c = repoConf();
    const h = { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...extra };
    if(c.token) h['Authorization'] = 'Bearer ' + c.token;
    return h;
  },
  async req(method, path, body, extraHeaders){
    const res = await fetch(this.base + path, { method, headers: this.headers(extraHeaders), body: body ? JSON.stringify(body) : undefined });
    if(res.status === 204) return null;
    const text = await res.text();
    let data = null; try { data = text ? JSON.parse(text) : null; } catch(e){ data = text; }
    if(!res.ok) throw new GHError((data && data.message) || res.statusText || ('HTTP '+res.status), res.status, data);
    return data;
  },
  contentsPath(p){ const c = repoConf(); return `/repos/${c.owner}/${c.repo}/contents/${p.split('/').map(encodeURIComponent).join('/')}`; },
  async getFile(p){
    const c = repoConf();
    const d = await this.req('GET', this.contentsPath(p) + '?ref=' + encodeURIComponent(c.branch) + '&t=' + Date.now());
    return { text: d.content ? b64decodeUtf8(d.content) : null, sha: d.sha, size: d.size, download_url: d.download_url };
  },
  async getJson(p){ const f = await this.getFile(p); return { data: f.text ? JSON.parse(f.text) : null, sha: f.sha }; },
  async getSha(p){ try { const f = await this.getFile(p); return f.sha; } catch(e){ if(e.status===404) return null; throw e; } },
  async putFile(p, base64, sha, message){
    const c = repoConf();
    const body = { message, content: base64, branch: c.branch };
    if(sha) body.sha = sha;
    return this.req('PUT', this.contentsPath(p), body);
  },
  async putJson(p, obj, sha, message){ return this.putFile(p, b64encodeUtf8(JSON.stringify(obj, null, 2) + '\n'), sha, message); },
  async deleteFile(p, sha, message){ const c = repoConf(); return this.req('DELETE', this.contentsPath(p), { message, sha, branch: c.branch }); },
  async rawBlob(p){
    const c = repoConf();
    const res = await fetch(this.base + this.contentsPath(p) + '?ref=' + encodeURIComponent(c.branch), { headers: this.headers({ 'Accept':'application/vnd.github.raw+json' }) });
    if(!res.ok) throw new GHError('Could not download file', res.status);
    return res.blob();
  },
  async dispatch(workflowFile, inputs){
    const c = repoConf();
    return this.req('POST', `/repos/${c.owner}/${c.repo}/actions/workflows/${workflowFile}/dispatches`, { ref: c.branch, inputs: inputs || {} });
  },
  async whoami(){ return this.req('GET', '/user'); },
  async repoInfo(){ const c = repoConf(); return this.req('GET', `/repos/${c.owner}/${c.repo}`); },
  async latestRun(workflowFile){ const c = repoConf(); const d = await this.req('GET', `/repos/${c.owner}/${c.repo}/actions/workflows/${workflowFile}/runs?per_page=1`); return d && d.workflow_runs && d.workflow_runs[0]; }
};

/* ---------- application state ---------- */
const S = {
  tracker: null, trackerSha: null,
  sources: null, sourcesSha: null,
  feed: null, checks: null, profile: null, profileSha: null,
  readonly: true, loaded: false, loadError: null,
  view: settings.get(LS.view) || 'jobs',
  selectedJobId: null, jobTab: 'overview', jobFilter: 'active', jobSort: 'deadline',
  docFilter: 'all', feedFilter: '', feedSource: 'all', feedSort: 'fit', feedMin: 'all', showAddJob: false, editingJob: false,
  query: '', uploads: [], checking: null, pendingSource: null, deletedIds: new Set(), showAdded: false, callDraft: null
};
function emptyTracker(){ return { schemaVersion: 1, updatedAt: nowIso(), jobs: [], documents: [], dismissedFeedIds: [], settings: {} }; }
function normalizeTracker(t){
  t = t && typeof t === 'object' ? t : emptyTracker();
  t.schemaVersion = t.schemaVersion || 1; t.jobs = t.jobs || []; t.documents = t.documents || []; t.dismissedFeedIds = t.dismissedFeedIds || []; t.settings = t.settings || {};
  for(const j of t.jobs){ j.materials = j.materials || []; j.interviews = j.interviews || []; j.contacts = j.contacts || []; j.stage = j.stage || 'preparing'; j.outcome = j.outcome || 'active'; for(const r of j.interviews) r.tasks = r.tasks || []; }
  for(const d of t.documents){ d.versions = d.versions || []; }
  return t;
}
async function fetchStatic(p){
  const res = await fetch(p + '?t=' + Date.now(), { cache: 'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status + ' for ' + p);
  return res.json();
}
async function loadAll(){
  const c = repoConf();
  S.loadError = null;
  try {
    if(c.token && c.owner && c.repo){
      const [t, s, f, k, p] = await Promise.all([
        gh.getJson('data/tracker.json').catch(e => { if(e.status===404) return {data:null, sha:null}; throw e; }),
        gh.getJson('data/sources.json').catch(e => { if(e.status===404) return {data:null, sha:null}; throw e; }),
        gh.getJson('data/feed.json').catch(() => ({data:null})),
        gh.getJson('data/link-checks.json').catch(() => ({data:null})),
        gh.getJson('data/profile.json').catch(() => ({data:null, sha:null}))
      ]);
      S.profile = normalizeProfile(p.data); S.profileSha = p.sha;
      S.tracker = normalizeTracker(t.data); S.trackerSha = t.sha;
      S.sources = s.data || { sources: [] }; S.sourcesSha = s.sha;
      S.feed = f.data || { generatedAt: null, sources: [], jobs: [] };
      S.checks = k.data || { checks: {} };
      S.readonly = false;
    } else {
      const [t, s, f, k, p] = await Promise.all([
        fetchStatic('data/tracker.json').catch(() => null),
        fetchStatic('data/sources.json').catch(() => null),
        fetchStatic('data/feed.json').catch(() => null),
        fetchStatic('data/link-checks.json').catch(() => null),
        fetchStatic('data/profile.json').catch(() => null)
      ]);
      S.profile = normalizeProfile(p);
      S.tracker = normalizeTracker(t); S.sources = s || { sources: [] }; S.feed = f || { generatedAt:null, sources:[], jobs:[] }; S.checks = k || { checks:{} };
      S.readonly = true;
      if(!t && location.protocol === 'file:') S.loadError = 'This page was opened as a local file, so it cannot read the data files. Open it from your GitHub Pages address, or add a token in Settings to read through the GitHub API.';
    }
    S.loaded = true;
  } catch(e){
    S.loaded = true; S.loadError = describeError(e);
    S.profile = S.profile || normalizeProfile(null); S.tracker = S.tracker || emptyTracker(); S.sources = S.sources || { sources: [] }; S.feed = S.feed || { generatedAt:null, sources:[], jobs:[] }; S.checks = S.checks || { checks:{} };
    S.readonly = true;
  }
}
function describeError(e){
  if(e instanceof GHError){
    if(e.status === 401) return 'GitHub rejected the token (401). Check that it was copied completely and has not expired.';
    if(e.status === 403) return 'GitHub refused (403): the token probably lacks permission for this repository. It needs Contents: read & write, and Actions: read & write.';
    if(e.status === 404) return 'GitHub could not find that (404). Check the owner and repository name in Settings — or the token has no access to the repo.';
    if(e.status === 409) return 'Someone else changed the file at the same time (409). Retrying…';
    return 'GitHub error ' + e.status + ': ' + e.message;
  }
  if(e && /Failed to fetch|NetworkError/.test(e.message)) return 'Could not reach GitHub — check your connection.';
  return e && e.message ? e.message : String(e);
}

/* ---------- saving (debounced, merge on conflict) ---------- */
let saveTimer = null, saving = false, dirty = false, lastSaveError = null;
function setSaveState(cls, text){ const el = $('#saveState'); el.className = 'savestate ' + cls; $('#saveText').textContent = text; }
function touch(msg){
  if(S.readonly){ toast('Read-only: add your GitHub token in Settings to save changes.', 'err'); return; }
  S.tracker.updatedAt = nowIso();
  dirty = true; S.pendingMessage = msg || 'Update tracker';
  setSaveState('saving', 'Unsaved…');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush, 900);
}
async function flush(){
  if(saving || !dirty) return;
  saving = true; dirty = false; setSaveState('saving', 'Saving…');
  const msg = S.pendingMessage || 'Update tracker';
  try {
    await putTrackerWithRetry(msg);
    lastSaveError = null; setSaveState('saved', 'Saved ' + new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}));
  } catch(e){
    lastSaveError = describeError(e); dirty = true; setSaveState('error', 'Not saved');
    toast('Save failed: ' + lastSaveError, 'err', { label:'Retry', fn: () => flush() });
  } finally { saving = false; if(dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 1500); } }
}
async function putTrackerWithRetry(msg){
  for(let attempt=0; attempt<3; attempt++){
    try {
      const res = await gh.putJson('data/tracker.json', S.tracker, S.trackerSha, msg);
      S.trackerSha = res.content.sha; return;
    } catch(e){
      if((e.status === 409 || e.status === 422) && attempt < 2){
        const remote = await gh.getJson('data/tracker.json').catch(() => ({data:null, sha:null}));
        S.trackerSha = remote.sha;
        if(remote.data) S.tracker = mergeTrackers(normalizeTracker(remote.data), S.tracker);
        continue;
      }
      throw e;
    }
  }
}
function mergeTrackers(remote, local){
  const byId = (arr) => Object.fromEntries(arr.map(x => [x.id, x]));
  const mergeList = (a, b) => { const m = byId(a); for(const x of b){ const y = m[x.id]; if(!y || (x.updatedAt||'') >= (y.updatedAt||'')) m[x.id] = x; } return Object.values(m); };
  const out = { ...remote, ...local };
  out.jobs = mergeList(remote.jobs, local.jobs).filter(j => !S.deletedIds.has(j.id));
  out.documents = mergeList(remote.documents, local.documents).filter(d => !S.deletedIds.has(d.id));
  out.dismissedFeedIds = Array.from(new Set([...(remote.dismissedFeedIds||[]), ...(local.dismissedFeedIds||[])]));
  return out;
}
window.addEventListener('beforeunload', e => { if(dirty || saving){ e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && dirty) flush(); });

/* ---------- derived data ---------- */
function jobById(id){ return S.tracker.jobs.find(j => j.id === id); }
function docById(id){ return S.tracker.documents.find(d => d.id === id); }
function docCurrent(d){ return d.versions[d.versions.length-1]; }
function readiness(job){
  const req = job.materials.filter(m => !['not_required','finalists_only'].includes(m.status));
  if(!req.length) return { pct: 0, ready: false, total: 0, done: 0 };
  const pct = Math.round(req.reduce((a,m) => a + (MAT_PCT[m.status] ?? 0), 0) / req.length);
  const done = req.filter(m => m.status === 'ready' || m.status === 'submitted').length;
  return { pct, ready: done === req.length, total: req.length, done };
}
function isClosed(job){ return job.outcome !== 'active'; }
function isInterviewing(job){ return ['zoom_scheduled','zoom_done','campus_scheduled','campus_done','offer'].includes(job.stage); }
function jobUsesDoc(docId){ return S.tracker.jobs.filter(j => j.materials.some(m => m.documentId === docId)); }
/* ---------- fit profile ---------- */
function normalizeProfile(p){
  p = p && typeof p === 'object' ? p : {};
  const list = (x) => Array.isArray(x) ? x.map(t => String(t).trim()).filter(Boolean) : [];
  return { updatedAt: p.updatedAt || '', core: list(p.core), related: list(p.related), avoid: list(p.avoid), weights: { core: 3, related: 1, avoid: -3, ...(p.weights||{}) }, goodFit: Number(p.goodFit) || 4, note: p.note || '' };
}
let _termCache = null;
function profileTerms(){
  if(_termCache && _termCache.src === S.profile) return _termCache.terms;
  const rxEsc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const terms = [];
  for(const tier of ['core','related','avoid']) for(const t of S.profile[tier]) terms.push({ term: t, tier, w: S.profile.weights[tier], rx: new RegExp('(?<![a-z0-9])' + rxEsc(t.toLowerCase()) + '(?:s|es)?(?![a-z0-9])', 'i') });
  _termCache = { src: S.profile, terms }; return terms;
}
function hasProfile(){ return S.profile && (S.profile.core.length + S.profile.related.length + S.profile.avoid.length) > 0; }
function fitScore(text){
  let score = 0; const matched = [];
  for(const t of profileTerms()) if(t.rx.test(text || '')){ score += t.w; matched.push(t.tier === 'avoid' ? '-' + t.term : t.term); }
  return { score, matched };
}
function jobFit(job){ return fitScore([job.title, job.department, job.area, job.summary, job.notes, job.rawText].join(' ')); }
function feedFit(f){
  if(typeof f.score === 'number') return { score: f.score, matched: f.matched || [], on: f.scoredOn || 'page' };
  const r = fitScore([f.title, f.institution, f.location, f.snippet].join(' ')); return { score: r.score, matched: r.matched, on: 'title' };
}
function fitClass(score){ const g = S.profile ? S.profile.goodFit : 4; return score >= g ? 'good' : score >= 1 ? 'accent' : score < 0 ? 'crit' : ''; }
function fitPill(fit, small){ return `<span class="pill ${fitClass(fit.score)}" title="${esc(fit.matched.join(', ') || 'no profile terms found')}">fit ${fit.score > 0 ? '+' : ''}${fit.score}${fit.on==='title' && !small ? ' <span class="faint">·title only</span>' : ''}</span>`; }

/* A feed posting counts as "in the tracker" if a job points at it, shares its URL, or has the same title at the same institution. */
function normUrl(u){ try { const x = new URL(u); x.hash = ''; ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid','ref','source','src'].forEach(k => x.searchParams.delete(k)); return (x.origin + x.pathname.replace(/\/$/,'') + (x.searchParams.toString() ? '?' + x.searchParams.toString() : '')).toLowerCase(); } catch(e){ return (u||'').trim().toLowerCase(); } }
function titleKey(t){ return (t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function instKey(i){ return (i||'').toLowerCase().replace(/^(the )/,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function trackerIndex(){
  const byFeed = new Map(), byUrl = new Map(), byTitle = new Map();
  for(const j of S.tracker.jobs){
    if(j.feedId) byFeed.set(j.feedId, j);
    if(j.url) byUrl.set(normUrl(j.url), j);
    const tk = titleKey(j.title); if(tk){ if(!byTitle.has(tk)) byTitle.set(tk, []); byTitle.get(tk).push(j); }
  }
  return { byFeed, byUrl, byTitle };
}
function trackerJobForFeed(f, idx){
  if(idx.byFeed.has(f.id)) return idx.byFeed.get(f.id);
  if(f.url && idx.byUrl.has(normUrl(f.url))) return idx.byUrl.get(normUrl(f.url));
  const cands = idx.byTitle.get(titleKey(f.title)) || [];
  const fi = instKey(f.institution);
  return cands.find(j => { const ji = instKey(j.institution); return !fi || !ji || ji.includes(fi) || fi.includes(ji); }) || null;
}
function matchFeedForJob(job){
  const u = job.url ? normUrl(job.url) : '', tk = titleKey(job.title), ji = instKey(job.institution);
  return (S.feed.jobs || []).find(f => (u && f.url && normUrl(f.url) === u) || (tk && titleKey(f.title) === tk && (!ji || !instKey(f.institution) || instKey(f.institution).includes(ji) || ji.includes(instKey(f.institution))))) || null;
}
function feedInbox(){
  const dismissed = new Set(S.tracker.dismissedFeedIds);
  const idx = trackerIndex();
  return (S.feed.jobs || []).filter(f => !dismissed.has(f.id)).map(f => { const j = trackerJobForFeed(f, idx); return { ...f, added: !!j, jobId: j ? j.id : null }; });
}

  $$('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === S.view));
  $('#cntJobs').textContent = S.tracker.jobs.filter(j => !isClosed(j)).length;
  $('#cntDocs').textContent = S.tracker.documents.length;
  $('#cntFeed').textContent = feedInbox().filter(f => !f.added).length;
  if(S.readonly && !dirty && !saving) setSaveState('readonly', S.loaded ? 'Read-only' : 'Loading…');
  const main = $('#main');
  let html = '';
  if(S.loadError) html += `<div class="banner crit"><p>${esc(S.loadError)}</p><button class="btn sm" data-action="reload">Try again</button></div>`;
  if(S.readonly && S.loaded && !S.loadError) html += `<div class="banner"><p><strong>Viewing only.</strong> To add jobs, upload files, or change anything, save your GitHub token under <a href="#" data-action="goto" data-view="settings">Settings</a>. The token stays in this browser.</p></div>`;
  if(S.query.trim()) html += renderSearch();
  else if(S.view === 'jobs') html += renderJobs();
  else if(S.view === 'materials') html += renderMaterials();
  else if(S.view === 'discover') html += renderDiscover();
  else html += renderSettings();
  main.innerHTML = html;
  if(S.view === 'jobs' && S.selectedJobId && window.innerWidth < 820){ const d = $('.detail'); if(d) d.scrollIntoView({ block:'start' }); }
}

/* ---------- search ---------- */
function renderSearch(){
  const q = S.query.trim().toLowerCase();
  const hit = (...fields) => fields.some(f => String(f||'').toLowerCase().includes(q));
  const jobs = S.tracker.jobs.filter(j => hit(j.institution, j.title, j.department, j.location, j.notes, j.summary, j.area, j.rawText, ...j.contacts.map(c => c.name+' '+c.email)));
  const docs = S.tracker.documents.filter(d => hit(d.name, d.notes, label(DOC_CATEGORIES,d.category), ...d.versions.map(v => v.fileName)));
  const feed = feedInbox().filter(f => hit(f.title, f.institution, f.location, f.snippet));
  let h = `<div class="row between" style="margin-bottom:12px"><h2 class="display">Search: “${esc(S.query)}”</h2><button class="btn sm quiet" data-action="clearsearch">Clear</button></div><div class="searchresults">`;
  if(!jobs.length && !docs.length && !feed.length) h += `<div class="empty"><p>Nothing matches yet.</p></div>`;
  for(const j of jobs) h += `<button class="sr" data-action="openjob" data-id="${j.id}"><span class="k">Job</span><span><strong>${esc(j.institution)}</strong> — ${esc(j.title)} <span class="muted small">${esc(label(STAGES,j.stage))}${j.deadline?' · due '+esc(fmtDate(j.deadline)):''}</span></span></button>`;
  for(const d of docs) h += `<button class="sr" data-action="opendocs" data-id="${d.id}"><span class="k">Document</span><span><strong>${esc(d.name)}</strong> <span class="muted small">${esc(label(DOC_CATEGORIES,d.category))} · ${d.versions.length} version${d.versions.length===1?'':'s'}</span></span></button>`;
  for(const f of feed.slice(0,40)) h += `<button class="sr" data-action="openfeed" data-id="${f.id}"><span class="k">Posting</span><span><strong>${esc(f.title)}</strong> <span class="muted small">${esc(f.institution||'')} · ${esc(sourceName(f.sourceId))}</span></span></button>`;
  return h + '</div>';
}

/* ---------- jobs ---------- */
function filteredJobs(){
  const f = S.jobFilter;
  let list = S.tracker.jobs.filter(j => {
    if(f === 'all') return true;
    if(f === 'closed') return isClosed(j);
    if(isClosed(j)) return false;
    if(f === 'active') return true;
    if(f === 'preparing') return j.stage === 'preparing';
    if(f === 'submitted') return j.stage === 'submitted' || j.stage === 'under_review';
    if(f === 'interviewing') return isInterviewing(j);
    if(f === 'due') { const d = daysUntil(j.deadline); return d !== null && d >= 0 && d <= 14; }
    if(f === 'ready') return j.stage === 'preparing' && readiness(j).ready;
    return true;
  });
  const s = S.jobSort;
  list.sort((a,b) => {
    if(s === 'deadline'){ const da = a.deadline || '9999', db = b.deadline || '9999'; return da < db ? -1 : da > db ? 1 : 0; }
    if(s === 'updated') return (b.updatedAt||'') < (a.updatedAt||'') ? -1 : 1;
    return (a.institution||'').localeCompare(b.institution||'');
  });
  return list;
}
function renderJobs(){
  const active = S.tracker.jobs.filter(j => !isClosed(j));
  const due = active.filter(j => { const d = daysUntil(j.deadline); return d !== null && d >= 0 && d <= 14; });
  const interviewing = active.filter(isInterviewing);
  const ready = active.filter(j => j.stage === 'preparing' && readiness(j).ready);
  let h = `<div class="stats">
    <div class="stat${due.length?' hot':''}" data-action="filter" data-filter="due"><div class="n">${due.length}</div><div class="l">Due in 14 days</div></div>
    <div class="stat" data-action="filter" data-filter="active"><div class="n">${active.length}</div><div class="l">Active applications</div></div>
    <div class="stat" data-action="filter" data-filter="interviewing"><div class="n">${interviewing.length}</div><div class="l">Interviewing</div></div>
    <div class="stat" data-action="filter" data-filter="ready"><div class="n">${ready.length}</div><div class="l">Ready to submit</div></div>
  </div>`;
  const chips = [['active','Active'],['due','Due soon'],['preparing','Preparing'],['submitted','Submitted'],['interviewing','Interviewing'],['ready','Ready'],['closed','Closed'],['all','All']];
  h += `<div class="toolbar"><div class="chips">${chips.map(([k,v]) => `<button class="chip${S.jobFilter===k?' active':''}" data-action="filter" data-filter="${k}">${v}</button>`).join('')}</div>
    <div class="row"><select data-action="sort" aria-label="Sort"><option value="deadline"${S.jobSort==='deadline'?' selected':''}>By deadline</option><option value="updated"${S.jobSort==='updated'?' selected':''}>Recently updated</option><option value="institution"${S.jobSort==='institution'?' selected':''}>By institution</option></select>
    <button class="btn primary" data-action="showadd"${S.readonly?' disabled':''}>${ICON.plus} Add job</button></div></div>`;
  if(S.showAddJob) h += renderAddJob();
  const list = filteredJobs();
  if(!S.tracker.jobs.length){
    h += `<div class="joblist"><div class="empty"><h3>No jobs yet</h3><p>Add the first position you're applying to, or open <a href="#" data-action="goto" data-view="discover">Discover</a> to pull postings from the boards you follow.</p>${S.readonly?'':'<button class="btn primary" data-action="showadd">'+ICON.plus+' Add job</button>'}</div></div>`;
  } else if(!list.length){
    h += `<div class="joblist"><div class="empty"><p>Nothing in this view. Try another filter.</p></div></div>`;
  } else {
    h += `<div class="joblist">` + list.map(renderJobRow).join('') + `</div>`;
  }
  const job = S.selectedJobId && jobById(S.selectedJobId);
  if(job) h += renderJobDetail(job);
  return h;
}
function deadlineCell(job){
  if(!job.deadline) return `<div class="dl muted">${job.deadlineNote ? esc(job.deadlineNote) : 'No deadline'}</div>`;
  const d = daysUntil(job.deadline);
  const cls = d < 0 ? 'past' : d <= 3 ? 'urgent' : d <= 14 ? 'soon' : '';
  const txt = d < 0 ? `${-d} day${d===-1?'':'s'} ago` : d === 0 ? 'today' : d === 1 ? 'tomorrow' : `in ${d} days`;
  return `<div class="dl ${cls}">${esc(fmtDate(job.deadline))}<span class="days">${txt}</span></div>`;
}
function stagePill(job){
  if(isClosed(job)) return `<span class="pill ${job.outcome==='accepted'?'good':job.outcome==='rejected'?'crit':''}">${esc(label(OUTCOMES,job.outcome))}</span>`;
  const cls = job.stage === 'offer' ? 'good' : isInterviewing(job) ? 'accent' : job.stage === 'preparing' ? '' : 'accent';
  return `<span class="pill ${cls}">${esc(label(STAGES,job.stage))}</span>`;
}
function renderJobRow(job){
  const r = readiness(job);
  const readyTxt = job.stage === 'preparing' ? (r.total ? `${r.done}/${r.total} materials ready` : 'No checklist yet') : (job.stage === 'submitted' || job.stage === 'under_review' ? 'Submitted' : '');
  return `<button class="jobrow${S.selectedJobId===job.id?' selected':''}" data-action="openjob" data-id="${job.id}">
    <div><div class="inst">${esc(job.institution)}${job.example?'<span class="example-tag">example</span>':''}</div><div class="ttl">${esc(job.title)}</div><div class="sub">${esc([job.department, job.location].filter(Boolean).join(' · '))}</div></div>
    ${deadlineCell(job)}
    <div class="stack" style="gap:4px;align-items:flex-start">${stagePill(job)}${hasProfile() ? fitPill(jobFit(job), true) : ''}</div>
    <div class="ready">${job.stage==='preparing' && r.total ? `<div class="meter${r.ready?' done':''}"><i style="width:${r.pct}%"></i></div>` : ''}<span>${esc(readyTxt)}</span></div>
  </button>`;
}

/* ---------- discover ---------- */
function sourceName(id){ const s = (S.sources.sources||[]).find(x => x.id === id) || (S.feed.sources||[]).find(x => x.id === id); return s ? s.name : (id || 'unknown source'); }
function sourceStatus(src){
  const st = (S.feed.sources||[]).find(x => x.id === src.id);
  if(src.enabled === false) return { cls:'', text:'Paused' };
  if(!st || !st.checkedAt) return { cls:'', text:'Not checked yet — the collector runs daily at 11:23 UTC (7:23 am Eastern)' };
  const when = fmtAgo(st.checkedAt);
  if(st.status === 'ok') return { cls:'good', text:`Reachable · ${st.found} posting${st.found===1?'':'s'} seen${st.new?`, ${st.new} new`:''} · ${when}` };
  if(st.status === 'no_postings') return { cls:'warn', text:`Reachable, but no postings found — the listings are probably drawn by JavaScript · ${when}` };
  if(st.status === 'blocked') return { cls:'crit', text:`Blocked — the site refuses automated visits (HTTP ${st.httpStatus||'?'}) · ${when}` };
  if(st.status === 'robots') return { cls:'warn', text:`Skipped — the site's robots.txt asks bots to stay out · ${when}` };
  if(st.status === 'error') return { cls:'crit', text:`Error: ${st.error||'unknown'} · ${when}` };
  return { cls:'', text: (st.status||'unknown') + ' · ' + when };
}
function renderDiscover(){
  const prof = hasProfile();
  const good = S.profile ? S.profile.goodFit : 4;
  const allInbox = feedInbox();
  const addedCount = allInbox.filter(f => f.added).length;

  if(prof){ inbox = inbox.map(f => ({ ...f, fit: feedFit(f) })); if(S.feedMin === 'good') inbox = inbox.filter(f => f.fit.score >= good); else if(S.feedMin === 'some') inbox = inbox.filter(f => f.fit.score >= 1); }
  if(prof && S.feedSort === 'fit') inbox.sort((a,b) => (b.fit.score - a.fit.score) || ((b.firstSeen||'') < (a.firstSeen||'') ? -1 : 1));
  const srcs = S.sources.sources || [];
  let h = `<div class="two"><div>
    <div class="row between" style="margin-bottom:10px"><h2 class="display" style="font-size:22px">New postings</h2><span class="small muted">${S.feed.generatedAt ? 'Feed updated ' + esc(fmtAgo(S.feed.generatedAt)) : 'The collector has not run yet'}</span></div>

      ${prof ? `<select data-action="feedsort"><option value="fit"${S.feedSort==='fit'?' selected':''}>Best fit first</option><option value="new"${S.feedSort==='new'?' selected':''}>Newest first</option></select>
      <select data-action="feedmin"><option value="all"${S.feedMin==='all'?' selected':''}>Any fit</option><option value="some"${S.feedMin==='some'?' selected':''}>Some fit (1+)</option><option value="good"${S.feedMin==='good'?' selected':''}>Good fit (${good}+)</option></select>` : `<a href="#" class="small" data-action="goto" data-view="settings">Set up a fit profile to rank these</a>`}</div>
    <div class="joblist">`;
  if(!inbox.length) h += `<div class="empty"><h3>${S.feed.generatedAt ? 'Inbox zero' : 'Nothing collected yet'}</h3><p>${S.feed.generatedAt ? 'Every posting here is already in your tracker or dismissed. New ones arrive after each daily run.' : 'Once the repository is on GitHub with Actions enabled, the collector checks your sources every morning. You can also run it now from the panel on the right.'}</p></div>`;
  else h += inbox.slice(0,200).map(f => `<div class="feeditem${f.added?' added':''}" id="feed-${f.id}">
      <div><div class="row" style="gap:8px"><div class="t">${esc(f.title)}</div>${f.fit ? fitPill(f.fit) : ''}</div><div class="s">${esc([f.institution, f.location].filter(Boolean).join(' · '))}${f.deadline?` · due ${esc(fmtDate(f.deadline))}`:''} · <span title="${esc(sourceName(f.sourceId))}">${esc(sourceName(f.sourceId))}</span> · first seen ${esc(fmtDate(f.firstSeen))}</div>${f.snippet?`<div class="s">${esc(f.snippet.slice(0,180))}${f.snippet.length>180?'…':''}</div>`:''}${f.fit && f.fit.matched.length ? `<div class="terms">${f.fit.matched.slice(0,8).map(t => `<span class="term${t.startsWith('-')?' neg':''}">${esc(t.replace(/^-/,''))}</span>`).join('')}${f.fit.matched.length>8?`<span class="term">+${f.fit.matched.length-8}</span>`:''}</div>`:''}</div>
      <div class="row">${f.url?`<a class="btn sm" href="${esc(f.url)}" target="_blank" rel="noopener">${ICON.ext}</a>`:''}${f.added?`<a href="#" class="pill good" data-action="openjob" data-id="${f.jobId}">In tracker</a>`:`<button class="btn sm primary" data-action="addfeed" data-id="${f.id}"${S.readonly?' disabled':''}>Add</button><button class="btn sm quiet" data-action="dismissfeed" data-id="${f.id}"${S.readonly?' disabled':''}>Dismiss</button>`}</div>
    </div>`).join('');
  h += `</div>${inbox.length>200?`<p class="small muted" style="margin-top:8px">Showing 200 of ${inbox.length}. Use the filter to narrow.</p>`:''}</div>`;

    </div>

      ${S.collectorMsg?`<p class="small muted" style="margin:6px 0">${esc(S.collectorMsg)}</p>`:''}
      <div class="joblist" style="margin-top:10px">${srcs.length ? srcs.map(s => { const st = sourceStatus(s); return `<div class="source"><div><div class="n">${esc(s.name)} <span class="pill" style="margin-left:4px">${esc(s.kind||'auto')}</span>${s.enabled===false?' <span class="pill">paused</span>':''}</div><div class="u">${esc(s.url)}</div><div class="st"><span class="pill ${st.cls}"><span class="dot"></span>${esc(st.text)}</span></div>${(s.include&&s.include.length)||(s.exclude&&s.exclude.length)?`<div class="small muted" style="margin-top:4px">${s.include&&s.include.length?'includes: '+esc(s.include.join(', ')):''}${s.exclude&&s.exclude.length?' · excludes: '+esc(s.exclude.join(', ')):''}</div>`:''}</div>
        <div class="stack" style="gap:4px"><button class="btn sm quiet" data-action="togglesource" data-id="${s.id}"${S.readonly?' disabled':''}>${s.enabled===false?'Resume':'Pause'}</button><button class="btn sm quiet danger" data-action="rmsource" data-id="${s.id}"${S.readonly?' disabled':''}>Remove</button></div></div>`; }).join('') : `<div class="empty"><p>No sources yet. Check a link above, then add it.</p></div>`}</div>
    </div>
  </div></div>`;
  return h;
}
function renderVerdict(){
  const c = S.checking; if(!c) return '';
  if(c.busy) return `<div class="verdict"><strong>Asking GitHub to fetch it…</strong><div class="small muted">${esc(c.note||'This takes 30–90 seconds. You can keep working; the result appears here.')}</div></div>`;
  if(c.error) return `<div class="verdict bad"><strong>Couldn't start the check.</strong><div class="small">${esc(c.error)}</div></div>`;
  const r = c.result; if(!r) return '';
  let cls = 'meh', head = '', body = '';
  if(r.status === 'ok'){ cls = 'ok'; head = `Reachable — found ${r.jobLinksFound} posting${r.jobLinksFound===1?'':'s'}${r.kind?` (read as ${r.kind})`:''}.`; }
  else if(r.status === 'no_postings'){ cls = 'meh'; head = 'Reachable, but no postings could be read from it.'; body = 'The page most likely draws its listings with JavaScript after loading, which a plain fetch never sees. Look for an RSS link on the site, or search for the same board with “rss” in the address.'; }
  else if(r.status === 'blocked'){ cls = 'bad'; head = `Blocked — the site refuses automated visits (HTTP ${r.httpStatus||'?'}).`; body = 'You will need to browse this one by hand. The collector will not try to get around it.'; }
  else if(r.status === 'robots'){ cls = 'meh'; head = 'Not checked — the site\'s robots.txt asks bots to stay out.'; body = 'The collector respects that. Browse it by hand.'; }
  else { cls = 'bad'; head = 'Could not fetch it.'; body = r.error || ''; }
  let h = `<div class="verdict ${cls}"><strong>${esc(head)}</strong>${body?`<div class="small" style="margin-top:4px">${esc(body)}</div>`:''}`;
  if(r.title) h += `<div class="small muted" style="margin-top:4px">Page title: ${esc(r.title)}</div>`;
  if(r.sample && r.sample.length) h += `<ul>${r.sample.slice(0,4).map(s => `<li>${esc(s.title)}${s.institution?` — ${esc(s.institution)}`:''}</li>`).join('')}</ul>`;
  if(r.status === 'ok' || r.status === 'no_postings'){
    const already = (S.sources.sources||[]).some(s => s.url === r.url);
    h += already ? `<p class="small muted" style="margin-top:8px">Already in your sources.</p>` : `<form class="stack" style="margin-top:10px" data-action-submit="addsource">
      <input type="hidden" name="url" value="${esc(r.url)}"><input type="hidden" name="kind" value="${esc(r.kind||'auto')}">
      <div class="grid c2"><label class="field"><span>Name</span><input type="text" name="name" value="${esc(r.suggestedName||r.title||'')}" required></label>
      <label class="field"><span>Check</span><select name="frequency"><option value="daily">Daily</option><option value="weekly">Weekly</option></select></label>
      <label class="field"><span>Only keep postings mentioning (comma-separated, optional)</span><input type="text" name="include" placeholder="communication, media"></label>
      <label class="field"><span>Skip postings mentioning (optional)</span><input type="text" name="exclude" placeholder="adjunct, part-time"></label></div>
      <div class="row end"><button class="btn primary" type="submit">${ICON.plus} Add as a source</button></div></form>`;
  }
  return h + '</div>';
}

    </div>
  </div>`;
}

/* ---------- toasts & confirm ---------- */
function toast(msg, kind='', action){
  const host = $('#toasts'); const el = document.createElement('div'); el.className = 'toast ' + kind;
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if(action) el.querySelector('button').addEventListener('click', () => { action.fn(); el.remove(); });
  host.appendChild(el); setTimeout(() => el.remove(), kind==='err' ? 9000 : 3500);
}
function confirmDialog(title, text, okLabel='Delete'){
  return new Promise(resolve => {
    const host = $('#confirmHost');
    host.innerHTML = `<div class="confirm"><div class="box"><h3>${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="row end" style="margin-top:14px"><button class="btn" data-c="0">Cancel</button><button class="btn danger" data-c="1">${esc(okLabel)}</button></div></div></div>`;
    host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { host.innerHTML = ''; resolve(b.dataset.c === '1'); }));
  });
}

const _scripts = {};
function loadScript(url){ if(!_scripts[url]) _scripts[url] = new Promise((res, rej) => { const el = document.createElement('script'); el.src = url; el.onload = res; el.onerror = () => rej(new Error('Could not load ' + url)); document.head.appendChild(el); }); return _scripts[url]; }
async function extractText(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.pdf') || file.type === 'application/pdf'){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let out = [];
    for(let i = 1; i <= Math.min(pdf.numPages, 12); i++){
      const page = await pdf.getPage(i); const tc = await page.getTextContent();
      let line = '', lastY = null;
      for(const it of tc.items){ if(lastY !== null && Math.abs(it.transform[5] - lastY) > 3){ out.push(line); line = ''; } line += (line && !line.endsWith(' ') && !it.str.startsWith(' ') ? ' ' : '') + it.str; lastY = it.transform[5]; }
      out.push(line);
    }
    return out.join('\n').replace(/[ \t]+\n/g, '\n').trim();
  }
  if(name.endsWith('.docx')){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const xml = await zip.file('word/document.xml').async('string');
    return xml.replace(/<\/w:p>/g, '\n').replace(/<w:tab\/>/g, '\t').replace(/<[^>]+>/g, '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").trim();
  }
  if(name.endsWith('.txt') || name.endsWith('.md') || name.endsWith('.rtf') || file.type.startsWith('text/')) return (await file.text()).replace(/\\[a-z]+\d* ?|[{}]/g, m => name.endsWith('.rtf') ? '' : m).trim();
  return '';
}
const MONTHS = { jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12 };
function toIsoDate(str){
  let m = str.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})/i);
  if(m) return `${m[3]}-${String(MONTHS[m[1].toLowerCase()]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  m = str.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?,?\s+(\d{4})/i);
  if(m) return `${m[3]}-${String(MONTHS[m[2].toLowerCase()]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  m = str.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
  if(m){ const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`; }
  m = str.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  return m ? m[0] : '';
}
/* Best-effort field guesses from an ad's text. Everything lands in the form for review. */
function parseJobCall(text){
  const t = (text || '').replace(/\r/g, '');
  const lines = t.split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const head = lines.slice(0, 60);
  const out = {};
  const rank = /\b(assistant|associate|full|visiting|clinical|open[- ]rank|tenure[- ]track)\b[^\n]{0,40}\b(professor|lecturer|instructor|faculty|fellow|chair)\b|\b(professor|lecturer|instructor|postdoctoral|postdoc|open[- ]rank|faculty position)\b/i;
  const titleLines = head.filter(l => rank.test(l) && l.length < 140 && !/^(the |we |our |applicants|candidates|review|deadline|salary)/i.test(l));
  if(titleLines.length){ out.title = (titleLines.find(l => /professor/i.test(l)) || titleLines[0]).replace(/[.:;]+$/, ''); }
  const inst = head.find(l => /\b(university|college|institute)\b/i.test(l) && !/\bof (communication|journalism|media|arts|business|liberal|humanities|social)\b/i.test(l) && l.length < 90 && !rank.test(l)) || head.find(l => /\b(university|college|institute)\b/i.test(l) && l.length < 90);
  if(inst){ const m = inst.match(/((?:the )?[A-Z][\w&.'’-]*(?:\s+(?:of|at|in|for|and|&|the|[A-Z][\w&.'’-]*))*\s*(?:university|college|institute)(?:\s+(?:of|at|in|for|and|&|the|[A-Z][\w&.'’-]*))*)/i); out.institution = (m ? m[1] : inst).replace(/[.,;:]+$/, '').trim(); }
  const dept = head.find(l => /\b(department|school|college|division|program) of\b/i.test(l) && l.length < 110 && l !== inst);
  if(dept){ const m = dept.match(/((?:department|school|college|division|program) of [^,.;()]{3,80})/i); out.department = (m ? m[1] : dept).trim(); }
  const loc = t.match(/\b([A-Z][a-zA-Z.'-]+(?: [A-Z][a-zA-Z.'-]+){0,3}), ([A-Z]{2})\b(?!\w)/);
  if(loc && !/^(University|College|School|Department)/.test(loc[1])) out.location = `${loc[1]}, ${loc[2]}`;
  else { const loc2 = t.match(/\b([A-Z][a-zA-Z.'-]+(?: [A-Z][a-zA-Z.'-]+){0,2}), (Qatar|Canada|Australia|Singapore|Hong Kong|United Kingdom|UK|England|Scotland|Netherlands|Germany|Denmark|Ireland|New Zealand|Switzerland|Sweden|Norway|Finland|Belgium|Korea|South Korea|Japan|China|UAE|United Arab Emirates|Israel|Italy|France|Spain|Austria|Portugal)\b/); if(loc2) out.location = `${loc2[1]}, ${loc2[2]}`; }
  const dl = t.match(/(deadline|review of applications? (?:will )?begins?|applications? (?:are )?due|apply by|closing date|closes|priority (?:consideration )?(?:date|deadline)|until|by)[^.\n]{0,80}/i);
  if(dl){ const iso = toIsoDate(dl[0]); if(iso) out.deadline = iso; out.deadlineNote = dl[0].replace(/\s+/g,' ').trim().slice(0, 120); }
  if(/open until filled/i.test(t)) out.deadlineNote = (out.deadlineNote ? out.deadlineNote + '; ' : '') + 'open until filled';
  const st = t.match(/\b(?:start(?:ing)? date|(?:appointment|position|employment)\s+(?:will\s+)?(?:begin|start)s?|beginning|effective|starting)\b[^.\n]{0,40}?\b((?:fall|spring|summer|autumn|winter|january|february|march|april|may|june|july|august|september|october|november|december)\s+(?:\d{1,2},?\s+)?\d{4})/i);
  if(st) out.startDate = st[1].replace(/^\w/, c => c.toUpperCase());
  const url = t.match(/https?:\/\/[^\s)>"']+/); if(url) out.url = url[0].replace(/[.,;]+$/, '');
  return out;
}

/* ---------- link checker ---------- */
async function startLinkCheck(url){
  if(!url) return;
  S.checking = { url, busy:true, startedAt: Date.now() }; render();
  try { await gh.dispatch('check-link.yml', { url }); }
  catch(e){ S.checking = { url, busy:false, error: describeError(e) + (e.status===404 ? ' — is .github/workflows/check-link.yml in the repository and are Actions enabled?' : '') }; render(); return; }
  const started = S.checking.startedAt;
  for(let i=0; i<40; i++){
    await new Promise(r => setTimeout(r, i < 4 ? 10000 : 8000));
    if(!S.checking || S.checking.url !== url || S.checking.startedAt !== started) return;
    try {
      const k = await gh.getJson('data/link-checks.json').catch(() => ({data:null}));
      const rec = k.data && k.data.checks && k.data.checks[url];
      if(rec && new Date(rec.checkedAt).getTime() > started - 60000){ S.checks = k.data; S.checking = { url, busy:false, result: rec }; render(); return; }
      S.checking.note = `Still waiting for GitHub (${Math.round((Date.now()-started)/1000)} s)… If nothing comes back, look at the Actions tab of the repository.`; if(S.view==='discover') render();
    } catch(e){ /* keep polling */ }
  }
  S.checking = { url, busy:false, error: 'No result after five minutes. Check the Actions tab on GitHub — the workflow may have failed or Actions may be disabled for this repository.' }; render();
}

    const u = { name: file.name, state:'busy', msg:'Uploading…' }; S.uploads.unshift(u); render();
    try {
      if(file.size > 25*1024*1024) throw new Error('larger than 25 MB');
      let d = replaceDocId ? docById(replaceDocId) : (matchByName ? S.tracker.documents.find(x => x.versions.some(v => v.fileName.toLowerCase() === file.name.toLowerCase()) || x.name.toLowerCase() === file.name.replace(/\.[^.]+$/,'').toLowerCase()) : null);
      const isNew = !d;
      if(isNew) d = { id: uid(), name: file.name.replace(/\.[^.]+$/,''), category: guessCategory(file.name), notes:'', versions:[], createdAt: nowIso(), updatedAt: nowIso() };
      const v = (d.versions.length ? d.versions[d.versions.length-1].v : 0) + 1;
      const fname = safeName(file.name);
      const path = `files/${d.id}/v${v}/${fname}`;
      const b64 = arrayBufferToB64(await file.arrayBuffer());
      const existingSha = await gh.getSha(path);
      await gh.putFile(path, b64, existingSha, `Upload ${fname} (${d.name} v${v})`);
      d.versions.push({ v, path, fileName: fname, size: file.size, uploadedAt: nowIso(), mime: file.type || '' }); d.updatedAt = nowIso();
      if(isNew) S.tracker.documents.push(d);
      u.state = 'ok'; u.msg = isNew ? `Added as “${d.name}”` : `Now v${v} of “${d.name}”`;
      touch(`Register upload: ${d.name} v${v}`);
    } catch(e){ u.state = 'err'; u.msg = 'Failed: ' + describeError(e); }
    render();
  }
}
async function importTracker(file){
  try {
    const incoming = normalizeTracker(JSON.parse(await file.text()));
    const before = S.tracker.jobs.length + S.tracker.documents.length;
    S.tracker = mergeTrackers(S.tracker, incoming);
    const after = S.tracker.jobs.length + S.tracker.documents.length;
    touch('Import tracker backup'); render(); toast(`Imported — ${after-before} new record${after-before===1?'':'s'} merged.`);
  } catch(e){ toast('That file could not be read as a tracker backup.', 'err'); }
}

/* ---------- field bindings ---------- */
function bindField(el){
  const jobId = el.dataset.job; if(!jobId) return false;
  const j = jobById(jobId); if(!j) return false;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if(el.dataset.jobField){ j[el.dataset.jobField] = val; }
  else if(el.dataset.mat && el.dataset.matField){
    const m = j.materials.find(m => m.id === el.dataset.mat); if(!m) return false;
    if(el.dataset.matField === 'documentId'){ m.documentId = val || null; m.documentVersion = null; }
    else if(el.dataset.matField === 'status'){ m.status = val; if(val === 'submitted' && m.documentId){ const d = docById(m.documentId); m.documentVersion = d ? docCurrent(d).v : null; } else if(val !== 'submitted') m.documentVersion = null; }
    else m[el.dataset.matField] = val;
  }
  else if(el.dataset.round){
    const r = j.interviews.find(r => r.id === el.dataset.round); if(!r) return false;
    if(el.dataset.task){ const t = r.tasks.find(t => t.id === el.dataset.task); if(t) t.done = el.checked; }
    else if(el.dataset.roundField){ r[el.dataset.roundField] = val; if(el.dataset.roundField === 'kind' && r.status === 'planning' && !r.tasks.some(t => t.done)) r.tasks = (DEFAULT_PREP[val]||[]).map(l => ({ id: uid(), label:l, done:false })); }
  }
  else if(el.dataset.contactField){ const c = j.contacts[+el.dataset.contact]; if(c) c[el.dataset.contactField] = val; }
  else return false;
  j.updatedAt = nowIso();
  return true;
}
function bindDocField(el){
  const d = docById(el.dataset.doc); if(!d) return false;
  d[el.dataset.docField] = el.value; d.updatedAt = nowIso(); return true;
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'); if(!a) return;
  if(a.tagName === 'A' && a.getAttribute('href') === '#') e.preventDefault();
  if(a.tagName === 'SELECT' || a.tagName === 'INPUT') return;
  const fn = actions[a.dataset.action]; if(fn) fn(a, e);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-action-submit]'); if(!f) return;
  e.preventDefault(); const fn = submits[f.dataset.actionSubmit]; if(fn) fn(f);
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.matches('select[data-action]')){ const fn = actions[el.dataset.action]; if(fn) fn(el, e); return; }
  if(el.matches('input[data-action-file]')){
    const kind = el.dataset.actionFile, file = el.files[0];
    if(kind === 'replace') uploadFiles(el.files, el.dataset.id);
    else if(kind === 'import') importTracker(file);
    else if(kind === 'readcall' && file){
      captureAddForm(); S.callDraft = { ...(S.callDraft||{}), file, fileName: file.name, fileSize: file.size, reading: true, readError: '' }; render();
      extractText(file).then(text => { S.callDraft.reading = false; if(text){ const g = parseJobCall(text); for(const k of Object.keys(g)) if(g[k] && !S.callDraft[k]) S.callDraft[k] = g[k]; S.callDraft.rawText = text.slice(0, 40000); } else S.callDraft.readError = 'Could not read text from that file (a scanned PDF has no text layer). The file will still be attached; fill in the fields by hand.'; render(); })
        .catch(e => { S.callDraft.reading = false; S.callDraft.readError = 'Could not read the file: ' + (e.message || e); render(); });
    }
    else if(kind === 'attachcall' && file){
      const j = jobById(el.dataset.id); if(!j || S.readonly) return;
      S.callBusy = j.id; render();
      (async () => {
        try {
          const d = await uploadCallFile(file, j); j.callDocumentId = d.id;
          const text = await extractText(file).catch(() => '');
          if(text && !j.rawText) j.rawText = text.slice(0, 40000);
          j.updatedAt = nowIso(); touch(`Attach job call: ${j.institution}`); toast('Job call attached.' + (text ? ' Posting text filled in.' : ''));
        } catch(e){ toast('Upload failed: ' + describeError(e), 'err'); }
        S.callBusy = null; render();
      })();
    }
    el.value=''; return;
  }
  if(el.matches('input[data-action-check=showadded]')){ S.showAdded = el.checked; render(); return; }
  if(el.id === 'fileInput'){ uploadFiles(el.files); el.value=''; return; }
  if(el.dataset.doc && el.dataset.docField){ if(bindDocField(el)){ touch('Update document'); if(el.tagName==='SELECT') render(); } return; }
  if(bindField(el)){
    const j = jobById(el.dataset.job); touch(`Update ${j.institution}`);
    if(el.tagName === 'SELECT' || el.type === 'checkbox' || el.type === 'date' || el.type === 'datetime-local') render();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 'searchBox'){ S.query = el.value; render(); return; }
  if(el.dataset.actionInput === 'feedfilter'){ S.feedFilter = el.value; const list = $('.two'); if(list){ const pos = el.selectionStart; render(); const n = $('[data-action-input=feedfilter]'); if(n){ n.focus(); n.setSelectionRange(pos,pos);} } return; }
  if(el.tagName === 'SELECT' || el.type === 'checkbox') return;
  if(el.dataset.doc && el.dataset.docField){ if(bindDocField(el)) touch('Update document'); return; }
  if(bindField(el)){ const j = jobById(el.dataset.job); touch(`Update ${j.institution}`); }
});
document.addEventListener('click', e => { const t = e.target.closest('#tabs button'); if(t) setView(t.dataset.view); });
document.addEventListener('dragover', e => { const z = e.target.closest('#dropzone'); if(z){ e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest('#dropzone'); if(z) z.classList.remove('over'); });
document.addEventListener('drop', e => { const z = e.target.closest('#dropzone'); if(z){ e.preventDefault(); z.classList.remove('over'); uploadFiles(e.dataTransfer.files); } });
document.addEventListener('keydown', e => { if(e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $('#searchBox').focus(); } if(e.key === 'Escape' && S.query){ S.query=''; $('#searchBox').value=''; render(); } });

(async function init(){
  await loadAll();
  render();
  if(!S.readonly) setSaveState('saved', 'Connected');
})();
</script>
